name: Bot de Arbitragem

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  executar:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          echo "================================"
          echo "ARQUIVOS DO REPOSITORIO"
          echo "================================"

          pwd

          echo ""
          echo "Arquivos na raiz:"
          ls -la

          echo ""
          echo "Todos os arquivos:"
          find . -maxdepth 3 -type f | sort

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar bot
        run: |
          python bot.py

      - name: Mostrar resultados
        if: always()
        run: |
          echo "================================"
          echo "RESULTADOS"
          echo "================================"

          if [ -f data/oportunidades.csv ]; then
            cat data/oportunidades.csv
          else
            echo "Arquivo de resultados ainda não existe."
          fi
