name: Teste do Bot

on:
  workflow_dispatch:

jobs:
  teste:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Mostrar arquivos
        run: |
          echo "=============================="
          echo "DIRETORIO ATUAL"
          echo "=============================="
          pwd

          echo ""
          echo "=============================="
          echo "ARQUIVOS"
          echo "=============================="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "=============================="
          echo "VERIFICANDO BOT.PY"
          echo "=============================="

          if [ -f bot.py ]; then
            echo "OK - bot.py EXISTE"
          else
            echo "ERRO - bot.py NAO EXISTE"
            exit 1
          fi

          echo ""
          echo "=============================="
          echo "VERIFICANDO CONFIG.PY"
          echo "=============================="

          if [ -f config.py ]; then
            echo "OK - config.py EXISTE"
          else
            echo "ERRO - config.py NAO EXISTE"
            exit 1
          fi

          echo ""
          echo "=============================="
          echo "VERIFICANDO REQUIREMENTS.TXT"
          echo "=============================="

          if [ -f requirements.txt ]; then
            echo "OK - requirements.txt EXISTE"
          else
            echo "ERRO - requirements.txt NAO EXISTE"
            exit 1
          fi
