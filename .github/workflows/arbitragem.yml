name: Diagnostico

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Mostrar tudo
        run: |
          echo "======================================"
          echo "DIRETORIO"
          echo "======================================"
          pwd

          echo ""
          echo "======================================"
          echo "ARQUIVOS DO PROJETO"
          echo "======================================"
          find . -type f | sort

          echo ""
          echo "======================================"
          echo "BOT.PY"
          echo "======================================"

          if [ -f "./bot.py" ]; then
            echo "BOT.PY ENCONTRADO"
            ls -lh ./bot.py
          else
            echo "BOT.PY NAO ENCONTRADO"
          fi

          echo ""
          echo "======================================"
          echo "CONFIG.PY"
          echo "======================================"

          if [ -f "./config.py" ]; then
            echo "CONFIG.PY ENCONTRADO"
            ls -lh ./config.py
          else
            echo "CONFIG.PY NAO ENCONTRADO"
          fi

          echo ""
          echo "======================================"
          echo "REQUIREMENTS.TXT"
          echo "======================================"

          if [ -f "./requirements.txt" ]; then
            echo "REQUIREMENTS.TXT ENCONTRADO"
            ls -lh ./requirements.txt
          else
            echo "REQUIREMENTS.TXT NAO ENCONTRADO"
          fi
